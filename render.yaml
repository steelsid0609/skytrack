services:
  - type: web
    name: skytrack-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: HYPIXEL_API_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
